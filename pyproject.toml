[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering"
version = "1.0.0"
description = "Deterministic AI Engineering Template: SDD + Strict TDD"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "RayRabbit AI", email = "dev@rayrabbit.site" }
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
markers = [
    "unit: Tests unitarios rápidos e independientes (< 5 segundos)",
    "integration: Pruebas de integración de contratos entre componentes",
    "legacy_baseline: Tests inmutables de caracterización de código heredado",
    "e2e: Pruebas de extremo a extremo en runtime real"
]
pythonpath = ["."]
addopts = "-ra -q --strict-markers"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass"
]
