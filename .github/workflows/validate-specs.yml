name: "OpenSpec Schema Validator"

on:
  push:
    paths:
      - 'openspec/**'
  pull_request:
    paths:
      - 'openspec/**'

permissions:
  contents: read

jobs:
  validate:
    name: "Validar Cambios y Especificaciones"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Validar OpenSpec con versión local bloqueada
        run: npm run spec:validate
