name: "Gate Validator (Deterministic AI Engineering)"

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-gate-commits:
    name: "Auditoría de Commits por Compuerta (Invariantes 1 y 3)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Autochequeo de Reglas Adversariales y Causalidad (Self-Test)
        run: |
          node scripts/verify-gates.mjs --self-test

      - name: Verificación de Integridad de Agentes y Auditor Adversarial (Guard)
        run: |
          node scripts/guard-agent.mjs

      - name: Calcular rango de commits seguro (F-04)
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=origin/${{ github.base_ref }}" >> $GITHUB_OUTPUT
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "base=HEAD~1" >> $GITHUB_OUTPUT
            else
              echo "base=$BEFORE" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Auditoría de modificación de compuertas en PR (F-01)
        if: github.event_name == 'pull_request'
        run: |
          MODIFIED_GATES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^(\.github/workflows/|scripts/verify|scripts/guard|\.agent/rules/)' || true)
          if [ -n "$MODIFIED_GATES" ]; then
            echo "⚠️ [GATE-AUDIT] PR modifica compuertas o reglas críticas:"
            echo "$MODIFIED_GATES"
            echo "Requiere aprobación obligatoria de CODEOWNERS antes de merge."
          fi

      - name: Validar Nomenclatura y Causalidad TDD (Node.js)
        run: |
          node scripts/verify-gates.mjs --base "${{ steps.range.outputs.base }}" --head HEAD

  validate-openspec:
    name: "Validación de Especificaciones OpenSpec"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Validar Coherencia de Especificaciones con versión local bloqueada
        run: |
          npm run spec:validate

  test-typescript:
    name: "Suite TypeScript / Node.js & Cobertura"
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != ''
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias bloqueadas (npm ci estricto)
        run: npm ci

      - name: Legacy-Guard (Suite de Caracterización @legacy-baseline)
        run: npm run test:ts:baseline

      - name: Tests Unitarios e Integración con Cobertura Mínima (Líneas ≥80%, Ramas ≥75%)
        run: npm run test:ts:coverage

  test-python:
    name: "Suite Python & Cobertura"
    runs-on: ubuntu-latest
    if: hashFiles('pyproject.toml') != ''
    steps:
      - name: Checkout repositorio con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -e .[test]

      - name: Autochequeo de Compuertas Adversariales (Python Self-Test)
        run: |
          python scripts/verify_gates.py --self-test

      - name: Calcular rango de commits seguro (F-04)
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=origin/${{ github.base_ref }}" >> $GITHUB_OUTPUT
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "base=HEAD~1" >> $GITHUB_OUTPUT
            else
              echo "base=$BEFORE" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Validar Nomenclatura y Causalidad TDD (Python History Audit)
        run: |
          python scripts/verify_gates.py --base "${{ steps.range.outputs.base }}" --head HEAD

      - name: Legacy-Guard (Suite de Caracterización @legacy_baseline)
        run: |
          pytest -m legacy_baseline --tb=short

      - name: Tests Unitarios e Integración con Medición de Ramas
        run: |
          pytest -m "unit or integration" --cov=src --cov-branch --cov-report=term-missing

      - name: Auditoría Mecánica de Cobertura Separada (Líneas ≥80%, Ramas ≥75% - F-09)
        run: |
          python scripts/check_python_coverage.py --min-lines 80 --min-branches 75
