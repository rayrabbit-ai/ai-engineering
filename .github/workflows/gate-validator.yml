name: "Gate Validator (Deterministic AI Engineering)"

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-gate-commits:
    name: "Auditoría de Commits por Compuerta (Invariantes 1 y 3)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio con historial completo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Bloqueo de alteración no autorizada de compuertas en PR (F-01)
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'allow-gate-update') && github.event.pull_request.author_association != 'OWNER' && github.event.pull_request.author_association != 'MEMBER'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          MODIFIED_GATES=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep -E '(^|/)(\.github/workflows/|scripts/|\.agent/rules/|\.agent/workflows/|package\.json|package-lock\.json|pyproject\.toml|requirements)' || true)
          if [ -n "$MODIFIED_GATES" ]; then
            echo "❌ [GATE-SECURITY-FAIL] El PR modifica compuertas, reglas, dependencias o workflows críticos:"
            echo "$MODIFIED_GATES"
            echo "Para modificar contratos centrales, un maintainer debe etiquetar el PR con 'allow-gate-update'."
            exit 1
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias bloqueadas
        run: npm ci --ignore-scripts
      - name: Configurar Python para Replay Polyglot
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Autochequeo de Reglas Adversariales y Causalidad (Self-Test)
        run: |
          node scripts/verify-gates.mjs --self-test
          python scripts/verify_gates.py --self-test
          node scripts/verify-red-failure.mjs --self-test
          python scripts/verify_red_failure.py --self-test
          node scripts/verify-historical-replay.mjs --self-test
          node scripts/verify-policy-coherence.mjs --self-test
          node scripts/guard-agent.mjs --self-test

      - name: Verificación de Coherencia Política↔Runtime (F-01)
        run: node scripts/verify-policy-coherence.mjs

      - name: Verificación de Integridad de Agentes y Auditor Adversarial (Guard)
        run: |
          node scripts/guard-agent.mjs

      - name: Validar Nomenclatura y Causalidad TDD (Node.js)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA" | head -n 1)"
          fi
          node scripts/verify-gates.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Replay Histórico Físico de Commits RED (F-02)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA" | head -n 1)"
          fi
          node scripts/verify-historical-replay.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  validate-openspec:
    name: "Validación de Especificaciones OpenSpec"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias bloqueadas
        run: npm ci --ignore-scripts
      - name: Validar Coherencia de Especificaciones con versión local bloqueada
        run: |
          npm run spec:validate

  test-typescript:
    name: "Suite TypeScript / Node.js & Cobertura"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias bloqueadas (npm ci estricto)
        run: npm ci --ignore-scripts
      - name: Auditar dependencias
        run: npm audit --audit-level=high

      - name: Legacy-Guard (Suite de Caracterización @legacy-baseline)
        run: npm run test:ts:baseline

      - name: Tests Unitarios e Integración con Cobertura Mínima (Líneas ≥80%, Ramas ≥75%)
        run: npm run test:ts:coverage

      - name: Suite E2E en Runtime Real TypeScript (Invariante 15)
        run: npm run test:ts:e2e

  test-python:
    name: "Suite Python & Cobertura"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio con historial completo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias con lockfile reproducible
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Autochequeo de Compuertas Adversariales (Python Self-Test)
        run: |
          python scripts/verify_gates.py --self-test
          python scripts/verify_red_failure.py --self-test

      - name: Validar Nomenclatura y Causalidad TDD (Python History Audit)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA" | head -n 1)"
          fi
          python scripts/verify_gates.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Legacy-Guard (Suite de Caracterización @legacy_baseline)
        run: |
          pytest -m legacy_baseline --tb=short

      - name: Tests Unitarios e Integración con Cobertura Mínima (Líneas ≥80%, Ramas ≥75%)
        run: |
          pytest -m "unit or integration" --cov=src --cov-branch --cov-report=term-missing --cov-report=json:.coverage-python.json
          python scripts/check_python_coverage.py .coverage-python.json --min-lines 80 --min-branches 75

      - name: Suite E2E en Runtime Real (Invariante 15)
        run: |
          pytest -m e2e --tb=short

  redteam-audit:
    name: "Escáner Heurístico de Seguridad y Contratos (Red-Team Interno)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio con historial completo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias bloqueadas
        run: |
          npm ci --ignore-scripts
          python -m pip install -r requirements-test.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Ejecutar Escáner Heurístico de Seguridad y Contratos (10 Dominios)
        run: |
          node scripts/redteam-audit.mjs --report docs/audit/informe-redteam.es.md
