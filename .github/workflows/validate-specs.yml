name: "OpenSpec Schema Validator"

on:
  push:
    paths:
      - 'openspec/**'
  pull_request:
    paths:
      - 'openspec/**'

jobs:
  validate:
    name: "Validar Cambios y Especificaciones"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validar OpenSpec
        run: npx --yes @fission-ai/openspec validate
