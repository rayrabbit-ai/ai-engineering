name: "OpenSpec Schema Validator"

on:
  push:
    paths:
      - 'openspec/**'
  pull_request:
    paths:
      - 'openspec/**'

permissions:
  contents: read

jobs:
  validate:
    name: "Validar Cambios y Especificaciones"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Validar OpenSpec con versión local bloqueada
        run: npm run spec:validate
