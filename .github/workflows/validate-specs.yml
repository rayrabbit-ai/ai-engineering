name: "OpenSpec Schema Validator"

on:
  push:
    paths:
      - 'openspec/**'
  pull_request:
    paths:
      - 'openspec/**'

permissions:
  contents: read

jobs:
  validate:
    name: "Validar Cambios y Especificaciones"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Validar OpenSpec con versión local bloqueada
        run: npm run spec:validate
